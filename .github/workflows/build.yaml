name: Build

on:
  workflow_call:

jobs:
  build-charm-under-test:
    strategy:
      matrix:
        arch:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: [self-hosted, linux, ARM64, medium, jammy]
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: canonical/identity-credentials-workflows/.github/actions/prepare@v3.1.5
        with:
          workflows-ref: v3.1.3

      - name: Set up Charmcraft and LXD
        uses: canonical/identity-credentials-workflows/.github/actions/setup-toolchains@v3.1.5
        with:
          toolchains: charmcraft
          charmcraft-channel: latest/stable
          lxd-channel: 5.21/stable

      - name: Build charm under test
        run: charmcraft pack --verbose

      - name: Archive Charm Under Test
        uses: actions/upload-artifact@v7
        with:
          name: built-charm-${{ matrix.arch.arch }}
          path: "*.charm"
          retention-days: 5
